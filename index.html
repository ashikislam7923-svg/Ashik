
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to Ashik's official personal website.">
  <meta name="theme-color" content="#080b14">
  <title>Ashik | Official Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b14;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 45px 20px;
      border: 1px solid #252c40;
      border-radius: 24px;
      background: #111827;
      box-shadow: 0 20px 70px #0008;
    }

    .logo {
      font-size: 65px;
      font-weight: bold;
      color: #8b9cff;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #aab3c5;
      line-height: 1.7;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 30px;
      border-radius: 30px;
      background: #7185ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      color: #69758c;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">A.</div>

    <h1>Welcome to Ashik</h1>

    <p>
      This is the official website of Ashik.
      A personal space for creativity,
      technology and new ideas.
    </p>

    <a class="button" href="mailto:hello@example.com">
      Contact Me
    </a>

    <footer>
      © 2026 Ashik. All Rights Reserved.
    </footer>
  </main>
</body>
